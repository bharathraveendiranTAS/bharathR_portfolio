<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bharath Kumar | Senior UI Engineer & Accessibility Architect</title>
    <meta
      name="description"
      content="Senior UI Engineer & Enterprise Accessibility Architecture Specialist portfolio for Bharath Kumar, featuring 100% WCAG 2.2 AA compliance, enterprise design systems, and high-performance interactive 3D web applications."
    />
    <meta property="og:title" content="Bharath Kumar | Senior UI Engineer & Accessibility Architect" />
    <meta
      property="og:description"
      content="Senior UI Engineer & Enterprise Accessibility Architecture Specialist portfolio for Bharath Kumar, featuring 100% WCAG 2.2 AA compliance, enterprise design systems, and high-performance interactive 3D web applications."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Base resets and smooth dark background */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #070a12;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow-x: hidden;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #070a12;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00e5ff;
      }

      /* Accessibility: Respect Reduced Motion (WCAG AA) */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- React Root Mount Point -->
    <div id="root"></div>

    <!-- React Application Entry Point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
